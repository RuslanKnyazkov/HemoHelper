<!doctype html>
{% load static %}
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Гемотест Хелпер - Лабораторная система</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="header">
      <div class="header__logo">
        <div class="logo-icon">
          <i class="fas fa-flask"></i>
        </div>
        <div class="logo-text">
          <h1>Гемотест Хелпер</h1>
          <span>Лабораторная система</span>
        </div>
      </div>

      <!-- Doombass блок в шапке -->
      <div
        class="doombass-block"
        onclick="turnStateMouse()"
        title="Кликер (раз в 5 минут)"
      >
        <img
          src="{% static 'images/images-other/doombass.jpeg' %}"
          alt="Doombass"
          width="40"
          height="40"
        />
        <span class="doombass-status"></span>
      </div>

      <nav class="header__nav">
        <button class="nav-btn" onclick="location.href='{% url 'home' %}'">
          <i class="fas fa-home"></i>
          <span>Главная</span>
        </button>
        <button class="nav-btn" onclick="location.href='{% url 'barcode' %}'">
          <i class="fas fa-barcode"></i>
          <span>Баркоды</span>
        </button>
        <button class="nav-btn" onclick="showModule('reagent')">
          <i class="fas fa-vial"></i>
          <span>Гемостаз</span>
        </button>
        <button class="nav-btn" onclick="showModule('roche')">
          <i class="fas fa-microscope"></i>
          <span>Roche</span>
        </button>
        <button class="nav-btn" onclick="showModule('calculations')">
          <i class="fas fa-calculator"></i>
          <span>Расчеты</span>
        </button>
        <button
          class="nav-btn"
          onclick="location.href='{% url 'teach-home' %}'"
        >
          <i class="fas fa-vial-virus"></i>
          <span>Тесты</span>
        </button>
      </nav>

      <button class="mobile-menu-btn">
        <i class="fas fa-bars"></i>
      </button>
    </header>

    <!-- Основной контент -->
    <main class="main">{% block content %} {% endblock %}</main>
  </body>
</html>
