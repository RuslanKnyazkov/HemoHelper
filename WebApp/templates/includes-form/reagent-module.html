<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="reagent-module" class="container-modern">
      <div class="container-header">
        <div class="container-icon">
          <i class="fas fa-vial"></i>
        </div>
        <div class="container-title">
          <h2>Гемостаз ACL Top 700</h2>
          <p>Интерактивный тренажер работы с реагентами</p>
        </div>
        <div class="container-stats">
          <span id="selected-reagent">Реагент не выбран</span>
        </div>
      </div>

      <div class="container-content">
        <div class="reagent-system">
          <div class="reagent-selector">
            <div class="reagent-group">
              <h4><i class="fas fa-vial"></i> Diluent's (Разбавители)</h4>
              <button class="reagent-btn" onclick="selectReagent('f_diluent')">
                Factor Diluent
                <span class="allowed-racks">D1, D2</span>
              </button>
              <button class="reagent-btn" onclick="selectReagent('pc_dil')">
                PC Diluent
                <span class="allowed-racks">D1, D2</span>
              </button>
            </div>

            <div class="reagent-group">
              <h4><i class="fas fa-vial"></i> Пара APTT (АЧТВ)</h4>
              <button
                class="reagent-btn"
                onclick="selectReagent('aptt_reagent')"
              >
                APTT reagent
                <span class="allowed-racks">D3, R1, R2</span>
              </button>
              <button class="reagent-btn" onclick="selectReagent('aptt_cacl2')">
                APTT CaCl2
                <span class="allowed-racks">R3, R4, R5, R6</span>
              </button>
            </div>

            <div class="reagent-group">
              <h4><i class="fas fa-flask"></i> Одиночные реагенты</h4>
              <button
                class="reagent-btn"
                onclick="selectReagent('recombiplastin')"
              >
                Recombiplastin
                <span class="allowed-racks">R3, R4, R5, R6</span>
              </button>
              <button
                class="reagent-btn"
                onclick="selectReagent('trombintime')"
              >
                Trombin Time
                <span class="allowed-racks">R3, R4, R5, R6</span>
              </button>
              <button class="reagent-btn" onclick="selectReagent('fibrinogen')">
                O.F.A Fibrinogen
                <span class="allowed-racks">R3, R4, R5, R6</span>
              </button>
            </div>

            <div class="quick-actions">
              <button class="quick-btn" onclick="clearSelection()">
                <i class="fas fa-times"></i>
                Снять выделение
              </button>
              <button class="quick-btn btn-secondary" onclick="clearAllRacks()">
                <i class="fas fa-trash"></i>
                Очистить все
              </button>
            </div>
          </div>

          <div class="rack-container">
            <!-- Racks will be generated here -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
