<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Calculations Module -->
    <div id="calculations-module" class="container-modern">
      <div class="container-header">
        <div class="container-icon">
          <i class="fas fa-calculator"></i>
        </div>
        <div class="container-title">
          <h2>Лабораторные расчеты</h2>
          <p>Инструменты для расчетов концентраций и разведений</p>
        </div>
      </div>

      <div class="container-content" style="padding: 24px">
        <div style="max-width: 500px; margin: 0 auto">
          <h3 style="margin-bottom: 24px">Расчет 0.1M NaOH</h3>

          <div class="input-group">
            <label class="input-label"
              >Количество дистиллированной воды (мл)</label
            >
            <input
              type="number"
              class="input-field"
              id="water-volume"
              placeholder="Введите объем от 1 до 1000 мл"
              min="1"
              max="1000"
              step="1"
            />
          </div>

          <div class="input-group">
            <label class="input-label">Необходимая молярность (M)</label>
            <input
              type="number"
              class="input-field"
              id="molarity"
              placeholder="Например: 0.1"
              min="0.1"
              max="10"
              step="0.1"
              value="0.1"
            />
          </div>

          <button
            class="btn btn-primary"
            onclick="calculateNaOH()"
            style="width: 100%; margin-bottom: 24px"
          >
            <i class="fas fa-calculator"></i>
            Рассчитать
          </button>

          <div
            id="calculation-result"
            class="result-card"
            style="display: none"
          >
            <!-- Results will be shown here -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
