<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="carousel-section" id="carousel-test">
      <div class="section-header">
        <h2>
          <i class="fas fa-rocket"></i>
          Доступные модули для тестирования
        </h2>
        <p class="section-subtitle">
          Выберите необходимый инструмент для работы
        </p>

        <!-- Контролы карусели -->
        <div class="carousel-controls">
          <button class="carousel-btn prev" id="carouselPrev">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="carousel-indicators" id="carouselIndicators">
            <!-- Индикаторы будут добавлены через JS -->
          </div>
          <button class="carousel-btn next" id="carouselNext">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- Карусель контейнер -->
      <div class="carousel-container">
        <div class="carousel-track" id="carouselTrack">
          <!-- Карточка 1 - Баркоды -->
          <div class="carousel-slide">
            <div class="module-card">
              <div class="module-card__header">
                <div class="module-badge">Сложное</div>
                <div class="module-icon">
                  <i class="fas fa-barcode"></i>
                </div>
                <h3 class="module-card__title">Аналиты группы Roche</h3>
                <p class="module-card__description">
                  Тренируйтесь и улучшайте свои знания в работе с анализаторами
                  Roche.
                </p>
              </div>

              <div class="module-card__features">
                <div class="feature-item">
                  <i class="fas fa-check"></i>
                  <span>Line 1 EEEE1</span>
                </div>
                <div class="feature-item">
                  <i class="fas fa-check"></i>
                  <span>Line 2 EEEE2</span>
                </div>
                <div class="feature-item">
                  <i class="fas fa-check"></i>
                  <span>Line 3 CEEE</span>
                </div>
              </div>

              <div class="module-card__footer">
                <button
                  class="module-btn"
                  onclick="testRocheModule()"
                  id="roshe-test"
                >
                  <i class="fas fa-arrow-right"></i>
                  Начать
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
