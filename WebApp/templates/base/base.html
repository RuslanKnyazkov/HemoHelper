<!doctype html>
{% load static %}
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Гемотест Хелпер — лабораторная система{% endblock %}
    </title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/reagents.css' %}" />

    <!-- ДОБАВИТЬ: Стили для анимированного фона -->
    <style>
      /* ===== АНИМИРОВАННЫЙ ФОН ДЛЯ ВСЕХ СТРАНИЦ ===== */
      .animated-bg {
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .gradient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        animation: floatOrb 20s ease-in-out infinite;
      }

      .orb-1 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, #667eea, transparent);
        top: -200px;
        right: -100px;
        animation-delay: 0s;
      }

      .orb-2 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #f093fb, transparent);
        bottom: -150px;
        left: -100px;
        animation-delay: -5s;
      }

      .orb-3 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #10b981, transparent);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: -10s;
      }

      .grid-pattern {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(rgba(102, 126, 234, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(102, 126, 234, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
      }

      @keyframes floatOrb {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(30px, -30px) scale(1.1);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.9);
        }
      }

      /* Убедимся, что основной контент поверх фона */
      .main,
      /* .header, */
      .hero,
      .main-content,
      .dashboard-card,
      .container-modern {
        position: relative;
        z-index: 1;
      }

      /* Падающие пробирки (только для главной, можно добавить при необходимости) */
      .hero-vials {
        position: absolute;
        top: -20px;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 2;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- АНИМИРОВАННЫЙ ФОН (БУДЕТ НА ВСЕХ СТРАНИЦАХ) -->
    <div class="animated-bg">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="gradient-orb orb-3"></div>
      <div class="grid-pattern"></div>
    </div>

    {% include 'header.html' %}
    <main class="main">{% block content %}{% endblock %}</main>

    <!-- Только core.js — все глобальные модули здесь -->
    <script src="{% static 'js/core.js' %}"></script>

    <!-- Остальные скрипты подключаются через extra_js в дочерних шаблонах -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
