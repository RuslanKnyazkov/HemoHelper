<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система сохранения номеров с режимами</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Первый контейнер (основной) -->
    <div class="container active" id="container1">
        <header>
            <h1><i class="fas fa-flask"></i> Гемотест хелпер</h1>
            <div class="subtitle">Сохраняйте номера с указанием режима</div>
        </header>

        <div class="content">
            <div class="left-panel">
                <div class="input-section">
                    <div class="input-group">
                        <label for="numberInput">
                            <i class="fas fa-hashtag"></i>
                            Номер пробы:
                        </label>
                        <div class="input-with-icon">
                            <i class="fas fa-barcode"></i>
                            <input type="text" 
                                   id="numberInput" 
                                   placeholder="Например: 123456789"
                                   maxlength="50"
                                   autocomplete="off"
                                   autocorrect="off"
                                   autocapitalize="off"
                                   spellcheck="false"
                                   autofocus>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>
                            <i class="fas fa-vial"></i>
                            Выберите режим анализа:
                        </label>
                        
                        <div class="mode-selector">
                            <button class="mode-btn mode-testosterone" data-mode="testosterone" data-display="Testosterone 1:10">
                                Testosterone 1:10
                            </button>
                            <button class="mode-btn mode-atpo" data-mode="a-tpo" data-display="A-TPO">
                                A-TPO
                            </button>
                            <button class="mode-btn mode-prog" data-mode="prog" data-display="Progesterone">
                                Progesterone
                            </button>
                            <button class="mode-btn mode-athsh" data-mode="a-thsr" data-display="A-THSR">
                                A-THSR
                            </button>
                            <button class="mode-btn mode-default" data-mode="default" data-display="По умолчанию">
                                По умолчанию
                            </button>
                            <button class="mode-btn mode-saliva" onclick="copySalivaInfo()" data-mode="saliva" data-display="Слюна">
                                Слюна
                            </button>
                            <button class="mode-btn mode-virtual" onclick="copyArhiveInfo()" data-mode="virtual" data-display="Виртуальный">
                                Вирт архив
                            </button>
                            <button class="mode-btn mode-duplicate" onclick="copyDoubleInfo()" data-mode="duplicate" data-display="Дубликат">
                                Дубликат
                            </button>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="saveNumber()" id="saveButton">
                        <i class="fas fa-save"></i>
                        Сохранить и скопировать
                    </button>
                    <button class="btn-secondary" onclick="clearInput()">
                        <i class="fas fa-eraser"></i>
                        Очистить форму
                    </button>
                </div>

                <div class="button-group">
                    <button class="btn-success" onclick="copyAllToClipboard()">
                        <i class="fas fa-copy"></i>
                        Копировать всё
                    </button>
                    <button class="btn-danger" onclick="clearAllData()">
                        <i class="fas fa-trash"></i>
                        Удалить все
                    </button>
                </div>

                <div class="status-section">
                    <div class="status-item">
                        <span class="status-label">Сохранено проб:</span>
                        <span class="status-value" id="countDisplay">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Текущий режим:</span>
                        <span class="status-value" id="currentModeDisplay">default</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Последнее сохранение:</span>
                        <span class="status-value" id="lastSaveTime">—</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">В буфере:</span>
                        <span class="status-value" id="clipboardStatus">пусто</span>
                    </div>
                </div>

            </div>

            <div class="right-panel">
                <h2><i class="fas fa-list"></i> История проб</h2>
                <div class="numbers-list" id="numbersList">
                </div>
            </div>
        </div>
        
        <!-- Кнопка перехода ко второму контейнеру -->
        <div class="container-nav">
            <button class="nav-btn next-btn" onclick="showContainer(2)">
                <i class="fas fa-arrow-right"></i>
                Второй блок
            </button>
        </div>
    </div>

    <!-- Второй контейнер (пустой, для вашего наполнения) -->
    <div class="container" id="container2">
        <header>
            <h1><i class="fas fa-cogs"></i> Второй блок</h1>
            <div class="subtitle">Здесь вы можете добавить свой функционал</div>
        </header>

        <div class="content">
            
            <div class="left-panel">
                <div class="button-group">
                    <button class="mode-btn mode-alicvots" onclick="showAlictotContent()">Аликвоты</button>
                </div>    
            </div>
            <div class="right-panel", id="right-panel2">
            </div>
        </div>
        
        <!-- Кнопки навигации -->
        <div class="container-nav">
            <button class="nav-btn prev-btn" onclick="showContainer(1)">
                <i class="fas fa-arrow-left"></i>
                Вернуться назад
            </button>
        </div>
    </div>

    <div class="message" id="message"></div>

    <!-- Индикаторы переключения -->
    <div class="container-indicators">
        <span class="indicator active" data-container="1"></span>
        <span class="indicator" data-container="2"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
