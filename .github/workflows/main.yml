name: Build Django EXE

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller
        cd WebApp
        python -m pip install -r requirements.txt

    - name: Сборка EXE
      run: |
        cd WebApp
        pyinstaller --onefile --name HemoHelper --add-data "WebApp;WebApp" --add-data "templates;templates" --add-data "static;static" --hidden-import django --collect-all django run.py

    - name: Загрузка EXE в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: HemoHelper
        path: ./WebApp/dist/HemoHelper.exe

    - name: Прикрепление к релизу
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./WebApp/dist/HemoHelper.exe
        asset_name: HemoHelper.exe
        asset_content_type: application/vnd.microsoft.portable-executable
