name: Build Django EXE

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller
        cd WebApp
        python -m pip install -r requirements.txt
        python -m pip install django  # явно ставим Django ещё раз

    - name: Проверка установки Django
      run: |
        cd WebApp
        python -c "import django; print('Django:', django.__version__)"

    - name: Сборка EXE
      run: |
        cd WebApp
        pyinstaller --onefile --name HemoHelper --add-data "WebApp;WebApp" --hidden-import django --hidden-import django.core.management --collect-all django run.py

    - name: Загрузка EXE в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: HemoHelper
        path: ./WebApp/dist/HemoHelper.exe