name: Build Django EXE

on:
  release:
    types: [created]  # Запускается при создании релиза
  workflow_dispatch:   # Можно запустить вручную из интерфейса GitHub

jobs:
  build:
    runs-on: windows-latest  # Windows для сборки .exe
    
    steps:
    - name: 📥 Клонирование репозитория
      uses: actions/checkout@v4

    - name: 🐍 Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🔧 Сборка EXE с помощью PyInstaller
      run: |
        pyinstaller --onefile --name MyDjangoApp --add-data "myproject;myproject" run.py
      # Замени myproject на имя папки твоего проекта

    - name: 📎 Прикрепление EXE к релизу
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/MyDjangoApp.exe
        asset_name: MyDjangoApp.exe
        asset_content_type: application/vnd.microsoft.portable-executable

    - name: 💾 Сохранение EXE как артефакт (для тестов)
      uses: actions/upload-artifact@v4
      with:
        name: Django-App
        path: ./dist/MyDjangoApp.exe