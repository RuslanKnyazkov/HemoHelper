name: Build Django EXE

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: 📥 Клонирование репозитория
      uses: actions/checkout@v4

    - name: 🐍 Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 📂 Сбор статических файлов
      run: |
        python manage.py collectstatic --noinput
      continue-on-error: false  # Теперь это обязательно

    - name: 🔧 Сборка EXE с помощью PyInstaller
      shell: bash
      run: |
        pyinstaller --onefile --name LAMI_Project --add-data "WebApp;WebApp" --add-data "static;static" run.py

    - name: 📎 Прикрепление EXE к релизу
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/LAMI_Project.exe
        asset_name: LAMI_Project.exe
        asset_content_type: application/vnd.microsoft.portable-executable

    - name: 💾 Сохранение EXE как артефакт
      uses: actions/upload-artifact@v4
      with:
        name: LAMI_Project-App
        path: ./dist/LAMI_Project.exe